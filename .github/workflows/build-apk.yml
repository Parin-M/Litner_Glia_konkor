name: Build Android APK and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Configure Android security and compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/android {/a\    ndkVersion = "28.0.13004108"' android/app/build.gradle.kts
            sed -i '/android {/a\    compileSdk = 36' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
            sed -i '/android {/a\    packaging { jniLibs { useLegacyPackaging = false } }' android/app/build.gradle.kts
            sed -i '/buildTypes {/a\        release { isMinifyEnabled = true }' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/android {/a\    ndkVersion "28.0.13004108"' android/app/build.gradle
            sed -i '/android {/a\    compileSdk 36' android/app/build.gradle
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' android/app/build.gradle
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/' android/app/build.gradle
            sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging false } }' android/app/build.gradle
            sed -i '/buildTypes {/a\        release { minifyEnabled true }' android/app/build.gradle
          fi

      - name: Restore app icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png

      - name: Build Noql offline AI assets
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "torch>=2.4,<2.8" "transformers>=5,<6" "sentence-transformers>=6.1,<6.2" "huggingface_hub>=0.25" "onnx>=1.16" "onnxruntime>=1.18"
          python3 tool/build_noql_ai.py

      - name: Configure ONNX Runtime shrinking
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class ai.onnxruntime.** { *; }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Glia Konkor ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
