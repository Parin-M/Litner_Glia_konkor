name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name glia_leitner .

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-leitner-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-leitner-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-leitner-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glia-leitner-apks
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --generate-notes --title "لایتنر هوشمند گلیا کنکور ${GITHUB_REF_NAME}"
