name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Restore logo asset
        run: |
          base64 -d assets/glia_app_icon.png.b64 > assets/glia_app_icon.png
          file assets/glia_app_icon.png

      - name: Create Android runner
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Apply Android hardening
        run: python3 tool/patch_android.py

      - name: Restore pub dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-konkor-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-konkor-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-konkor-x86_64.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apks
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --generate-notes --title "گلیا کنکور ${GITHUB_REF_NAME}"
