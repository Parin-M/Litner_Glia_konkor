name: Native Flutter Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .
      - name: Generate native data from HTML source
        run: dart run tool/generate_native_data.dart
      - name: Restore logo
        run: base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Configure Android release
        env:
          GLIA_KEYSTORE_B64: ${{ secrets.GLIA_KEYSTORE_B64 }}
          GLIA_STORE_PASSWORD: ${{ secrets.GLIA_STORE_PASSWORD }}
          GLIA_KEY_ALIAS: ${{ secrets.GLIA_KEY_ALIAS }}
          GLIA_KEY_PASSWORD: ${{ secrets.GLIA_KEY_PASSWORD }}
        run: |
          python3 tool/prepare_android.py
          if [ -z "$GLIA_KEYSTORE_B64" ] || [ -z "$GLIA_STORE_PASSWORD" ] || [ -z "$GLIA_KEY_ALIAS" ] || [ -z "$GLIA_KEY_PASSWORD" ]; then
            echo "Release keystore secrets are required for signed releases."
            exit 1
          fi
          echo "$GLIA_KEYSTORE_B64" | base64 --decode > android/glia-release.jks
          cat > android/key.properties <<EOF
storePassword=$GLIA_STORE_PASSWORD
keyPassword=$GLIA_KEY_PASSWORD
keyAlias=$GLIA_KEY_ALIAS
storeFile=glia-release.jks
EOF
      - name: Dependencies
        run: flutter pub get
      - name: Launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-konkor-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-konkor-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-konkor-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/glia-konkor-release.aab
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-native
          path: dist/*
          retention-days: 30
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/*.aab dist/SHA256SUMS.txt --generate-notes --title "گلیا کنکور ${GITHUB_REF_NAME}"
