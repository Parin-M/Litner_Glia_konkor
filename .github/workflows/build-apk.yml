name: Build Android APK and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Set up Python for the offline AI model
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/build-apk.yml

      - name: Validate bundled learning data
        run: python tool/validate_data.py

      - name: Test Android build configuration scripts
        run: python -m unittest discover -s tool -p 'test_*.py'

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Remove generated Flutter demo test
        run: rm -f test/widget_test.dart

      - name: Configure Android release build
        run: python tool/prepare_android.py

      - name: Restore launcher icon
        shell: bash
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
          file assets/glia_icon.png

      - name: Cache downloaded Noql model
        uses: actions/cache@v4
        with:
          path: build/noql
          key: noql-model-${{ runner.os }}-${{ hashFiles('tool/build_noql_ai.py') }}

      - name: Build Noql offline AI assets
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<2.8" "transformers>=5,<6" "sentence-transformers>=6.1,<6.2" "huggingface_hub>=0.25" "onnx>=1.16" "onnxruntime>=1.18"
          python tool/build_noql_ai.py
          test -s assets/ai/noql.onnx
          test -s assets/ai/tokenizer.json
          test -s assets/ai/card_embeddings.bin

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icon resources
        run: dart run flutter_launcher_icons

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run regression tests
        run: flutter test

      - name: Build optimized Android APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols

      - name: Create APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: glia-konkor-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dart obfuscation symbols
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: glia-konkor-symbols-${{ github.ref_name }}
          path: build/symbols/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: glia-konkor-apk
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Glia Konkor ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
