name: Flutter Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Restore app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
          test -s assets/glia_icon.png

      - name: Generate native data only for the initial migration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f assets/generated_original_deck.json || ! -f assets/generated_persian_pack.json ]]; then
            test -f reference/leitner_original.html
            test -f reference/persian_pack.html
            dart run tool/generate_native_data.dart
          fi

      - name: Configure package id
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.glia.konkor"/' android/app/build.gradle.kts
          sed -i 's/namespace = "[^"]*"/namespace = "com.glia.konkor"/' android/app/build.gradle.kts

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Release keystore secrets are not configured; building validation APKs only.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/glia-release.jks
          cat > android/key.properties <<EOF
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyPassword=$ANDROID_KEY_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
storeFile=glia-release.jks
EOF
          chmod 600 android/glia-release.jks android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'create("release")' not in s:
              marker = '    defaultConfig {'
              block = '''    signingConfigs {
          create("release") {
              val props = java.util.Properties()
              val keyFile = rootProject.file("key.properties")
              if (keyFile.exists()) keyFile.inputStream().use { props.load(it) }
              keyAlias = props.getProperty("keyAlias")
              keyPassword = props.getProperty("keyPassword")
              storeFile = props.getProperty("storeFile")?.let { rootProject.file(it) }
              storePassword = props.getProperty("storePassword")
          }
      }
'''
              s = s.replace(marker, block + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart/Flutter code
        run: flutter analyze

      - name: Test Dart/Flutter code
        run: flutter test

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify signed APKs
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            apksigner verify --verbose "$apk"
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-konkor-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-konkor-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-konkor-x86_64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.signing.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS.txt --generate-notes --title "Glia Konkor ${GITHUB_REF_NAME}"

      - name: Commit the migrated data and remove HTML sources
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f assets/generated_original_deck.json && -f assets/generated_persian_pack.json && -f tool/generate_native_data.dart ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/generated_original_deck.json assets/generated_persian_pack.json
            git rm -f reference/leitner_original.html reference/persian_pack.html tool/generate_native_data.dart
            git rm -rf assets/html_b64
            git commit -m "Migrate embedded learning data to Flutter JSON"
            git push
          fi

      - name: Cleanup signing material
        if: always()
        run: rm -f android/glia-release.jks android/key.properties
