name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --project-name glia_leitner --org com.gliakonkor .

      - name: Configure Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in s:
              i = s.find(">")
              s = s[:i+1] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + s[i+1:]
          s = s.replace('android:label="glia_leitner"', 'android:label="گلیا کنکور"')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="false" ', 1)
          else:
              s = s.replace('android:usesCleartextTraffic="true"', 'android:usesCleartextTraffic="false"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-konkor-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-konkor-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-konkor-x86_64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apks
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS.txt \
            --generate-notes \
            --title "گلیا کنکور ${GITHUB_REF_NAME}"
