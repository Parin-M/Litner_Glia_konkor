name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Configure Android security and compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/android {/a\    ndkVersion = "28.0.13004108"' android/app/build.gradle.kts
            sed -i '/android {/a\    compileSdk = 36' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
            sed -i '/android {/a\    packaging { jniLibs { useLegacyPackaging = false } }' android/app/build.gradle.kts
            sed -i '/buildTypes {/a\        release { isMinifyEnabled = true }' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/android {/a\    ndkVersion "28.0.13004108"' android/app/build.gradle
            sed -i '/android {/a\    compileSdk 36' android/app/build.gradle
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' android/app/build.gradle
            sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging false } }' android/app/build.gradle
            sed -i '/buildTypes {/a\        release { minifyEnabled true }' android/app/build.gradle
          fi
          # Keep the APK limited to the permissions actually needed by Flutter plugins.
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -E 'uses-permission' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Restore app icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              header = 'import java.util.Properties\n\nval keystoreProperties = Properties().apply {\n    val file = rootProject.file("key.properties")\n    if (file.exists()) load(file.inputStream())\n}\n\n'
              if "val keystoreProperties = Properties()" not in s:
                  s = header + s
              block = '''    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties["keyAlias"] as String
            keyPassword = keystoreProperties["keyPassword"] as String
            storeFile = file(keystoreProperties["storeFile"] as String)
            storePassword = keystoreProperties["storePassword"] as String
        }
    }
'''
              if 'create("release")' not in s:
                  s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          PY
          rm -f android/release.jks android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
