name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Configure Android security and compatibility
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/android {/a\    ndkVersion = "28.0.13004108"' android/app/build.gradle.kts
            sed -i '/android {/a\    compileSdk = 36' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
            sed -i '/android {/a\    packaging { jniLibs { useLegacyPackaging = false } }' android/app/build.gradle.kts
            sed -i '/buildTypes {/a\        release { isMinifyEnabled = true }' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/android {/a\    ndkVersion "28.0.13004108"' android/app/build.gradle
            sed -i '/android {/a\    compileSdk 36' android/app/build.gradle
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 36/' android/app/build.gradle
            sed -i '/android {/a\    packagingOptions { jniLibs { useLegacyPackaging false } }' android/app/build.gradle
            sed -i '/buildTypes {/a\        release { minifyEnabled true }' android/app/build.gradle
          fi
          # Keep the APK limited to the permissions actually needed by Flutter plugins.
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            grep -E 'uses-permission' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Restore app icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore android/release.jks \
            -storepass android -keypass android \
            -alias glia-release -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Glia Konkor, OU=Android, O=Glia, L=, ST=, C=AZ"
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=glia-release
          storeFile=../release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              header = '''import java.util.Properties

          val keystoreProperties = Properties().apply {
              val file = rootProject.file("key.properties")
              if (file.exists()) load(file.inputStream())
          }

          '''
              if "val keystoreProperties = Properties()" not in s:
                  s = header + s
              signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
              if 'create("release")' not in s:
                  s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              if 'signingConfig = signingConfigs.getByName("release")' not in s:
                  s = s.replace('release {', 'release {\n        signingConfig = signingConfigs.getByName("release")', 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
