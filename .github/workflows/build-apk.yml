name: Flutter Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .

      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png

      - name: Set application id
        run: |
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.glia.konkor"/' android/app/build.gradle.kts
          sed -i 's/namespace = "[^"]*"/namespace = "com.glia.konkor"/' android/app/build.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30
