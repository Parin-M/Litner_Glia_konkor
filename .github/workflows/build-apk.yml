name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create Android runner
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .
      - name: Restore logo asset
        run: |
          base64 -d assets/glia_app_icon.png.b64 > assets/glia_icon.png
          file assets/glia_icon.png
      - name: Generate native data
        run: dart run tool/generate_native_data.dart
      - name: Detect release signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured; validation APKs will use Flutter's default release signing."
          fi
      - name: Restore release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/glia-release.jks
          cat > android/key.properties <<EOF
storePassword=$ANDROID_KEYSTORE_PASSWORD
keyPassword=$ANDROID_KEY_PASSWORD
keyAlias=$ANDROID_KEY_ALIAS
storeFile=glia-release.jks
EOF
          chmod 600 android/glia-release.jks android/key.properties
      - name: Apply Android hardening and optional signing
        run: python3 tool/prepare_android.py
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signatures
        if: steps.signing.outputs.available == 'true'
        run: |
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            apksigner verify --verbose "$apk" | tail -n 12
          done
      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/glia-konkor-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/glia-konkor-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/glia-konkor-x86_64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glia-konkor-apks
          path: dist/*
          retention-days: 30
      - name: Publish/update GitHub Release
        if: steps.signing.outputs.available == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk -F: '/^version:/ {gsub(/ /,"",$2); print $2}' pubspec.yaml | cut -d+ -f1)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --generate-notes --title "گلیا کنکور $TAG"
          fi
      - name: Cleanup signing material
        if: always()
        run: rm -f android/glia-release.jks android/key.properties
