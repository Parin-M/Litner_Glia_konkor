name: Flutter Universal Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create all Flutter platforms
        run: flutter create --platforms=android,ios,web,windows,macos,linux --org com.glia.konkor --project-name glia_leitner .
      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create Android platform
        run: flutter create --platforms=android --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: glia-android-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  web:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create Web platform
        run: flutter create --platforms=web --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: glia-web
          path: build/web

  linux:
    needs: analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Create Linux platform
        run: flutter create --platforms=linux --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: glia-linux
          path: build/linux/x64/release/bundle

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create Windows platform
        run: flutter create --platforms=windows --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        shell: bash
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: glia-windows
          path: build/windows/x64/runner/Release

  macos:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create macOS platform
        run: flutter create --platforms=macos --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: glia-macos
          path: build/macos/Build/Products/Release

  ios:
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Create iOS platform
        run: flutter create --platforms=ios --org com.glia.konkor --project-name glia_leitner .
      - name: Restore icon
        run: |
          mkdir -p assets
          base64 --decode assets/glia_app_icon.png.b64 > assets/glia_icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: glia-ios-unsigned
          path: build/ios/iphoneos/Runner.app
