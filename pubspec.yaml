name: glia_leitner
description: لایتنر هوشمند گلیا کنکور - Native Flutter
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  flutter_onnxruntime: ^1.8.5
  dart_sentencepiece_tokenizer: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/generated_original_deck.json
    - assets/generated_persian_pack.json
    - assets/glia_icon.png
    - assets/ai/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/glia_icon.png
  adaptive_icon_background: '#06152D'
  adaptive_icon_foreground: assets/glia_icon.png
  min_sdk_android: 24
